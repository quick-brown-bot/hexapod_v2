[platformio]
; This dir already holds a valid standalone idf.py project (root CMakeLists.txt
; + main/CMakeLists.txt with idf_component_register). Point PlatformIO's
; espidf framework at that existing main/ component instead of expecting the
; conventional top-level src/.
src_dir = main

[env:esp32dev]
; Standalone RS485 bring-up/benchmark app for the MainBoard (ESP32-WROOM-32D,
; see hardware/mainboard/mainboard_sch.py). Built with the ESP-IDF project
; layout already in this directory (CMakeLists.txt / main/) -- PlatformIO's
; espidf framework drives idf.py under the hood, so no separate devcontainer
; is needed to build/flash this one app.
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
