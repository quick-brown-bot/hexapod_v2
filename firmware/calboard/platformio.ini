[env:seeed_xiao_rp2040]
; Same toolchain as firmware/leg/ — arduino-pico (Earle Philhower) core, so
; this board can reuse native hardware/pwm.h, hardware/adc.h, hardware/gpio.h
; alongside Arduino APIs. See firmware/leg/platformio.ini for the rationale.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
